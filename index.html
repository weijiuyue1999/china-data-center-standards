<header class="topbar"><div class="topbar-in"><div><h1>中国数据中心标准规范政策条文参数库</h1><p class="subtitle">按指标、房间、专业、条款和标准交叉查询可核验设计要求</p></div><div class="header-meta"><div class="stamp">数据版本 2026-07-30</div><div class="developer">中国电子院·奥意建筑&nbsp;&nbsp;开发</div></div></div></header>
<main class="shell">
<div class="notice"><strong>数据边界：</strong>标准目录收录77份文件；条文库含258条结构化要求，覆盖8部核心标准。每条均标注完整正文、扫描页、公开节选或官方元数据的核验等级；未取得全文的内容不补写数值。工程应用应以主管部门发布的现行正式文本为准。</div>
<section aria-label="查询条件">
<div class="toolbar">
<div class="field search-field"><label for="search">关键词、房间、数值或条款</label><input id="search" type="search" placeholder="例如：荷载、净高、UPS室、1.4m、13.2.5、消防" autocomplete="off"></div>
<div class="field"><label for="standard">标准来源</label><select id="standard"><option value="">全部标准</option></select></div>
<div class="field"><label for="profession">专业</label><select id="profession"><option value="">全部专业</option></select></div>
<div class="field"><label for="metric">指标</label><select id="metric"><option value="">全部指标</option></select></div>
<div class="field"><label for="object">房间/对象</label><select id="object"><option value="">全部对象</option></select></div>
<div class="field"><label for="unit">单位</label><select id="unit"><option value="">全部单位</option></select></div>
<div class="field"><label for="group">分组</label><select id="group"><option value="none">不分组</option><option value="metric">按指标</option><option value="object">按房间/对象</option><option value="profession">按专业</option><option value="doc">按标准</option></select></div>
</div>
<div class="quick" id="quick"><span>快捷查询：</span></div>
<div class="summary"><div><div class="counts"><span class="count">标准目录 <strong id="docCount">0</strong></span><span class="count">精确条文 <strong id="reqCount">0</strong></span><span class="count">当前结果 <strong id="resultCount">0</strong></span></div><div class="coverage" id="coverage"></div></div><div class="actions"><div class="tabs"><button id="reqView" class="btn active" aria-pressed="true">精确条文</button><button id="docView" class="btn" aria-pressed="false">标准目录</button></div><button id="reset" class="btn">清除筛选</button><button id="export" class="btn">导出CSV</button><button id="print" class="btn btn-primary">打印</button></div></div>
</section>
<section id="results" aria-label="查询结果"></section>
<section id="detail" class="detail hidden" aria-live="polite"></section>
<p class="footer">“条文说明”记录已单独标注，其效力低于规范正文；数值前的≥、≤、&gt;、&lt;为便于比较的结构化表达，规范用词仍以“应/不应/宜/不宜/可”为准。</p>
</main>

function renderDocs(data){if(!data.length){el.results.innerHTML='<div class="empty">没有匹配的标准文件。</div>';return}el.results.innerHTML='<div class="doc-grid">'+data.map(function(d){return '<button class="doc-card" data-id="'+esc(d.id)+'"><span class="doc-code">'+esc(d.code)+'</span><span class="doc-name">'+esc(d.name)+'</span><div class="doc-summary">'+esc(d.summary)+'</div><div class="tags"><span class="badge">'+esc(d.type)+'</span><span class="badge">'+esc(d.level)+'</span><span class="badge">'+esc(d.status)+'</span></div></button>'}).join('')+'</div>';el.results.querySelectorAll('[data-id]').forEach(function(b){b.addEventListener('click',function(){showDoc(docMap[b.dataset.id])})})}
function showReq(r){var d=docMap[r.doc]||{};el.detail.classList.remove('hidden');el.detail.innerHTML='<h2>'+esc(r.metric)+'｜'+esc(r.object)+'</h2><dl class="detail-grid"><dt>结构化数值</dt><dd class="value">'+esc(r.value)+' '+esc(r.unit)+'</dd><dt>完整要求</dt><dd>'+esc(r.rule)+'</dd><dt>适用条件</dt><dd>'+esc(r.condition||'—')+'</dd><dt>例外/备注</dt><dd>'+esc(r.note||'—')+'</dd><dt>专业</dt><dd>'+esc(r.profession)+'</dd><dt>来源</dt><dd>'+esc(d.code)+'《'+esc(d.name)+'》 '+esc(r.ref)+'</dd><dt>依据类型</dt><dd>'+esc(r.basis)+'</dd><dt>核验状态</dt><dd>'+esc(r.verified)+'</dd><dt>公开文本</dt><dd><a href="'+esc(r.sourceUrl)+'" target="_blank" rel="noopener">打开核验来源</a></dd></dl>'}
function showDoc(d){var rs=requirements.filter(function(r){return r.doc===d.id});var cs=clauses.filter(function(c){return c.doc===d.id});el.detail.classList.remove('hidden');el.detail.innerHTML='<h2>'+esc(d.code)+'｜'+esc(d.name)+'</h2><dl class="detail-grid"><dt>类型</dt><dd>'+esc(d.type)+'</dd><dt>层级</dt><dd>'+esc(d.level)+'</dd><dt>状态</dt><dd>'+esc(d.status)+'</dd><dt>阶段</dt><dd>'+esc(d.stage)+'</dd><dt>专业</dt><dd>'+esc((d.prof||[]).join('、'))+'</dd><dt>简介</dt><dd>'+esc(d.summary)+'</dd><dt>精确条文</dt><dd>'+rs.length+' 条</dd><dt>定位索引</dt><dd>'+cs.length+' 条（概括性摘要，非原文）</dd><dt>来源入口</dt><dd><a href="'+esc(d.url)+'" target="_blank" rel="noopener">打开主管/发布平台</a></dd></dl>'}
function render(){var isReq=state.view==='requirements';el.reqView.classList.toggle('active',isReq);el.reqView.setAttribute('aria-pressed',String(isReq));el.docView.classList.toggle('active',!isReq);el.docView.setAttribute('aria-pressed',String(!isReq));[el.metric,el.object,el.unit,el.group].forEach(function(x){x.disabled=!isReq});var data=isReq?filteredReqs():filteredDocs();el.resultCount.textContent=data.length;var covered=new Set(requirements.map(function(r){return r.doc})).size;el.coverage.textContent=isReq?'条文库覆盖'+covered+'部核心标准、'+new Set(requirements.map(function(r){return r.metric})).size+'类指标；核验等级详见每条记录。':'目录搜索不会将文件简介当作精确条文。';if(isReq)renderReqs(data);else renderDocs(data)}
[el.search,el.standard,el.profession,el.metric,el.object,el.unit,el.group].forEach(function(x){x.addEventListener(x===el.search?'input':'change',function(){state.q=el.search.value;state.doc=el.standard.value;state.profession=el.profession.value;state.metric=el.metric.value;state.object=el.object.value;state.unit=el.unit.value;state.group=el.group.value;render()})});
el.reqView.addEventListener('click',function(){state.view='requirements';render()});el.docView.addEventListener('click',function(){state.view='documents';render()});
document.getElementById('reset').addEventListener('click',function(){state.q='';state.doc='';state.profession='';state.metric='';state.object='';state.unit='';state.group='none';state.selected='';el.search.value='';[el.standard,el.profession,el.metric,el.object,el.unit].forEach(function(x){x.value=''});el.group.value='none';el.detail.classList.add('hidden');render()});
document.getElementById('print').addEventListener('click',function(){window.print()});
document.getElementById('export').addEventListener('click',function(){var rows;if(state.view==='requirements'){rows=[['指标','专业','房间/对象','数值','单位','条件','要求','备注','标准','条款','核验状态']].concat(filteredReqs().map(function(r){var d=docMap[r.doc]||{};return[r.metric,r.profession,r.object,r.value,r.unit,r.condition,r.rule,r.note,d.code,r.ref,r.verified]}))}else{rows=[['标准号','名称','类型','层级','效力','状态','年份','专业','简介']].concat(filteredDocs().map(function(d){return[d.code,d.name,d.type,d.level,d.force,d.status,d.year,(d.prof||[]).join('、'),d.summary]}))}var csv='\ufeff'+rows.map(function(row){return row.map(function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=state.view==='requirements'?'数据中心精确条文.csv':'数据中心标准目录.csv';a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)});
render();
</script>
</body>
</html>
